<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#EDEFFA;
    --shell-bg:#FFFFFF;
    --sidebar-bg:#FFFFFF;
    --primary:#3A63F0;
    --primary-dark:#2E4FD1;
    --primary-soft:#EAF0FF;
    --mint:#22C08C;
    --mint-soft:#E5F8F1;
    --amber:#F0A93C;
    --amber-soft:#FDF1DE;
    --red:#F0524B;
    --red-soft:#FCE9E8;
    --text:#1B1F3B;
    --text-soft:#9297B5;
    --border:#EEF0F8;
    --radius:20px;
    --shadow:0 10px 34px rgba(40,50,120,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page-bg); color:var(--text);
    font-family:'Noto Sans KR', sans-serif; min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:32px 16px;
  }
  .shell{
    width:100%; max-width:1280px; background:var(--shell-bg); border-radius:30px;
    box-shadow:var(--shadow); display:flex; overflow:hidden; min-height:calc(100vh - 64px);
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:220px; flex:0 0 220px; background:var(--sidebar-bg);
    padding:28px 16px; display:flex; flex-direction:column;
    border-right:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:9px; padding:4px 10px 28px; font-weight:800; font-size:16px; color:var(--primary);}
  .brand-mark{width:30px; height:30px; border-radius:10px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;}
  .nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-soft); padding:4px 12px; margin-bottom:6px; font-weight:700;}
  .nav-label span{text-transform:none; letter-spacing:0; font-size:10px;}
  .channel-item{display:flex; align-items:center; gap:6px;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,24,50,0.45); display:flex;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-box{
    background:#fff; border-radius:20px; width:100%; max-width:560px; padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25); display:flex; flex-direction:column; gap:4px;
  }
  .modal-header{display:flex; align-items:center; justify-content:space-between; font-size:15px; font-weight:800; margin-bottom:8px;}
  .modal-close{border:none; background:#F5F6FC; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:13px; color:var(--text-soft);}
  .channel-tabs{display:flex; flex-direction:column; gap:5px;}
  .channel-tab{
    display:flex; align-items:center; gap:11px;
    border:none; background:transparent; color:#6A6F91;
    padding:11px 14px; border-radius:14px; font-size:13px; font-weight:700;
    cursor:pointer; text-align:left; width:100%;
  }
  .channel-tab:hover{background:var(--primary-soft); color:var(--primary);}
  .channel-tab.active{background:var(--primary); color:#fff; box-shadow:0 8px 18px rgba(58,99,240,0.32);}
  .tab-dot{width:24px; height:24px; border-radius:8px; flex:0 0 24px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff;}
  .channel-tab.active .tab-dot{background:rgba(255,255,255,0.25) !important;}

  /* ---------- Main ---------- */
  .main{flex:1; padding:32px 36px 48px; min-width:0;}
  .topbar{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:10px;}
  .topbar h1{font-size:24px; font-weight:800; margin:0;}
  .topbar-icons{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%; background:#F5F6FC; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--text-soft); cursor:default;
  }
  .subtitle{font-size:12.5px; color:var(--text-soft); margin:0 0 24px; font-weight:600;}
  .subtitle b{color:var(--primary);}

  /* ---------- Grid / Cards ---------- */
  .grid{display:grid; grid-template-columns:1.2fr 1fr; gap:22px;}
  @media (max-width:980px){ .grid{grid-template-columns:1fr;} }

  .card{background:#fff; border-radius:18px; border:1px solid var(--border);}
  .card-header{
    padding:16px 22px; font-size:13.5px; font-weight:800; color:var(--text);
    display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border);
  }
  .card-header .pill{font-size:10.5px; font-weight:700; color:var(--primary); background:var(--primary-soft); padding:4px 10px; border-radius:999px;}
  .card-body{padding:18px 22px 24px;}

  .group-title{font-size:11px; font-weight:800; color:var(--text-soft); text-transform:uppercase; letter-spacing:.6px; margin:16px 0 8px;}
  .group-title:first-child{margin-top:0;}

  .note-box{font-size:11.5px; color:#6A6F91; background:var(--primary-soft); border-radius:12px; padding:10px 13px; margin-bottom:14px; line-height:1.55;}

  .field-row{display:grid; grid-template-columns: 100px 1fr 56px; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .field-row:last-child{border-bottom:none;}
  .field-label{font-size:11.5px; color:var(--text-soft); font-weight:700;}
  .field-input{
    border:1px solid var(--border); background:#FAFBFF; border-radius:10px;
    padding:9px 13px; font-family:'Noto Sans KR'; font-size:13px; color:var(--text); width:100%;
  }
  .field-input:focus{outline:none; border-color:var(--primary); background:#fff;}
  .field-count{text-align:right; font-size:10.5px; font-weight:700; color:var(--text-soft);}
  .field-count.over{color:var(--red);}
  .field-row.over .field-input{border-color:var(--red); background:var(--red-soft);}
  .field-row.limit-hit .field-input{border-color:var(--red) !important; background:var(--red-soft) !important; transition:background .1s;}
  .field-row.bulk-filled .field-input{background:var(--mint-soft) !important; transition:background .25s;}
  .field-px{grid-column:1 / -1; text-align:right; font-size:10px; color:var(--text-soft); margin-top:-6px; padding-bottom:3px;}
  .field-px.over{color:var(--red); font-weight:700;}

  .spec-hint{font-size:11.5px; color:#6A6F91; background:var(--mint-soft); border-radius:12px; padding:10px 13px; margin-bottom:10px; line-height:1.5;}

  .upload-box{
    border:1.5px dashed var(--border); border-radius:14px; padding:16px; text-align:center; cursor:pointer;
    min-height:130px; display:flex; align-items:center; justify-content:center; position:relative; background:#FAFBFF;
  }
  .upload-box:hover{border-color:var(--primary);}
  .upload-box.has-image{border-style:solid; padding:0; background:#fff;}
  .upload-box img{max-width:100%; max-height:210px; display:block; margin:0 auto; border-radius:12px;}
  .upload-hint{font-size:12px; color:var(--text-soft);}
  .upload-hint b{display:block; font-size:13.5px; color:var(--text); margin-bottom:4px;}
  input[type=file]{display:none;}
  .remove-img{position:absolute; top:8px; right:8px; background:var(--text); color:#fff; border:none; width:24px; height:24px; border-radius:50%; cursor:pointer; font-size:13px;}
  .transparency-badge{
    position:absolute; bottom:8px; left:8px; font-size:11px; font-weight:700; padding:5px 10px;
    border-radius:999px; background:#F5F6FC; color:var(--text-soft);
  }
  .transparency-badge.yes{background:var(--mint-soft); color:#158F67;}
  .transparency-badge.no{background:var(--red-soft); color:#C13B32;}
  .transparency-badge.unknown{background:var(--amber-soft); color:#A9750F;}

  .submit-btn{
    width:100%; background:var(--primary); color:#fff; border:none; padding:14px;
    border-radius:999px; font-size:14px; font-weight:800; cursor:pointer; margin-top:16px;
    box-shadow:0 10px 22px rgba(58,99,240,0.30);
  }
  .submit-btn:hover{background:var(--primary-dark);}
  .submit-btn:disabled{background:#CBD0EA; box-shadow:none; cursor:not-allowed;}

  .result-body{display:flex; flex-direction:column; min-height:320px;}
  .empty-state, .loading-state{flex:1; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--text-soft); font-size:13px; line-height:1.7;}
  .loading-state{flex-direction:column; gap:12px;}
  .spin{width:38px; height:38px; border:4px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .verdict-pill{
    display:inline-flex; align-items:center; gap:8px; border-radius:999px; padding:9px 18px;
    font-size:13.5px; font-weight:800; margin-bottom:16px;
  }
  .verdict-pill .dot{width:9px; height:9px; border-radius:50%;}
  .verdict-pill.pass{background:var(--mint-soft); color:#158F67;}
  .verdict-pill.pass .dot{background:var(--mint);}
  .verdict-pill.warn{background:var(--amber-soft); color:#A9750F;}
  .verdict-pill.warn .dot{background:var(--amber);}
  .verdict-pill.fail{background:var(--red-soft); color:#C23A33;}
  .verdict-pill.fail .dot{background:var(--red);}

  .issue-list{display:flex; flex-direction:column; gap:9px;}
  .issue{border-radius:14px; background:#FAFBFF; border:1px solid var(--border); border-left:4px solid; padding:11px 14px;}
  .issue.high{border-left-color:var(--red);}
  .issue.medium{border-left-color:var(--amber);}
  .issue.low{border-left-color:var(--text-soft);}
  .issue-cat{font-size:10.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;}
  .issue.high .issue-cat{color:var(--red);}
  .issue.medium .issue-cat{color:var(--amber);}
  .issue.low .issue-cat{color:var(--text-soft);}
  .issue-reason{font-size:12.5px; margin:4px 0 5px; line-height:1.5; color:var(--text);}
  .issue-fix{font-size:11.5px; color:var(--text-soft); line-height:1.5;}
  .no-issues{text-align:center; font-size:13px; color:#158F67; font-weight:700; background:var(--mint-soft); border-radius:14px; padding:16px;}
  .error-box{background:var(--red-soft); border:1px solid var(--red); color:#C23A33; border-radius:14px; padding:12px; font-size:13px; text-align:center;}

  footer{text-align:center; font-size:11px; color:var(--text-soft); margin-top:26px;}

  /* ---------- Preview ---------- */
  .preview-box{
    display:flex; align-items:center; gap:0; background:#f3f3f6; border-radius:12px;
    overflow:hidden; border:1px solid var(--border); min-height:70px;
  }
  .preview-img-slot{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:repeating-conic-gradient(#e9e9ef 0% 25%, #f7f7fa 0% 50%) 50% / 14px 14px;
    height:100%; min-height:70px;
  }
  .preview-img-slot img{display:block; max-height:90px; object-fit:contain;}
  .preview-text-slot{flex:1; padding:8px 14px; min-width:0;}
  .preview-line{
    font-family:'Noto Sans KR', sans-serif; font-size:14px; font-weight:700; color:#222;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .preview-line.sub{font-size:13px; font-weight:400; color:#666; margin-top:2px;}
  .preview-line.overflow{background:linear-gradient(90deg, transparent 80%, var(--red-soft)); color:var(--red);}
  .preview-meta{font-size:10.5px; color:var(--text-soft); margin-top:6px; line-height:1.5;}

  /* ---------- 여러 소재(반복 아이템) ---------- */
  .apply-bulk-btn{
    margin-top:8px; width:100%; background:var(--primary); color:#fff; border:none; padding:10px;
    border-radius:10px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .apply-bulk-btn:hover{background:var(--primary-dark);}

  .item-card{border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:12px; background:#fff;}
  .item-card-header{display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:800; color:var(--primary); margin-bottom:6px;}
  .item-remove-btn{border:none; background:var(--red-soft); color:var(--red); font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px; cursor:pointer;}
  .item-copy-btn{border:none; background:var(--primary-soft); color:var(--primary); font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px; cursor:pointer;}
  .add-item-btn{
    width:100%; border:1.5px dashed var(--border); background:transparent; color:var(--primary);
    padding:11px; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer; margin-top:4px;
  }
  .add-item-btn:hover{background:var(--primary-soft);}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">✓</span> AD REVIEW</div>

    <div class="nav-label">채널 선택</div>
    <div class="channel-tabs" id="channelTabs"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="pageTitle">검수 데스크</h1>
      <div class="topbar-icons">
        <div class="icon-btn" id="settingsBtn" style="cursor:pointer;">⚙</div>
        <div class="icon-btn">i</div>
      </div>
    </div>
    <p class="subtitle" id="subtitleLine">채널을 선택하고 소재를 입력해줘</p>

    <div class="grid">
      <div class="card">
        <div class="card-header"><span>구성 요소</span><span class="pill">입력</span></div>
        <div class="card-body">
          <div id="formArea"></div>

          <div class="group-title" id="imageGroupTitle">이미지</div>
          <div id="imageGroupArea">
            <div class="spec-hint" id="specHint"></div>
            <div class="upload-box" id="uploadBox">
              <input type="file" id="fileInput" accept="image/*">
              <div class="upload-hint" id="uploadHint"><b>+ 이미지 업로드</b>클릭해서 소재 이미지를 올려줘</div>
            </div>
          </div>

          <div id="previewSection" style="display:none;">
            <div class="group-title">미리보기 (근사치 — 실제 렌더링과 다를 수 있음)</div>
            <div id="previewArea"></div>
          </div>

          <button class="submit-btn" id="submitBtn">검수 요청</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span>판정 결과</span><span class="pill">AI 예측</span></div>
        <div class="card-body result-body" id="resultBody">
          <div id="resultArea"><div class="empty-state">입력 다 채우고<br>검수 요청을 누르면<br>여기에 결과가 나와</div></div>
        </div>
      </div>
    </div>

    <footer>참고용 사전 필터링 도구 — 최종 승인/반려는 각 플랫폼 심사 기준을 따릅니다</footer>
  </main>
</div>

<div class="modal-overlay" id="settingsModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <span>설정</span>
      <button class="modal-close" id="closeSettings">✕</button>
    </div>
    <div class="note-box" style="margin-bottom:4px;">
      Gemini API 키를 입력하면 브라우저에 저장돼서 다음에도 자동으로 쓰여. 키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> 에서 무료로 발급받을 수 있어.
    </div>
    <div class="field-row" style="grid-template-columns:1fr;">
      <input type="text" id="apiKeyInput" class="field-input" placeholder="여기에 API 키 붙여넣기">
    </div>
    <button class="submit-btn" id="saveApiKeyBtn" style="margin-top:12px;">저장</button>
    <div id="apiKeyStatus" style="text-align:center; font-size:12px; color:var(--mint); margin-top:8px; min-height:16px;"></div>
  </div>
</div>

<script>
/* ---------------- 채널 정의 ---------------- */
const CHANNELS = {
  brand_video: {
    label:'브랜드검색(영상형)', unit:'char', dotColor:'#03C75A', dotText:'N', brandCopyFormat:true,
    groups:[
      {name:'소재 정보', fields:[['행사명', null],['배경색(RGB)', null]]},
      {name:'PC', fields:[['새소식',36],['메인타이틀',18],['설명문구',23],['설명문구',23],['서브링크1',21],['서브링크2',21],['서브링크3',21],['섬네일문구',8],['섬네일문구',8],['섬네일문구',8]]},
      {name:'MO', fields:[['새소식',18],['서브타이틀',15],['타이틀',14],['설명문구',17],['설명문구',17],['섬네일문구',7],['섬네일문구',7],['섬네일문구',7],['섬네일문구',7]]}
    ],
    spec:null, noImageReview:true
  },
  brand_image: {
    label:'브랜드검색(이미지형)', unit:'char', dotColor:'#03C75A', dotText:'N', brandCopyFormat:true,
    groups:[
      {name:'소재 정보', fields:[['행사명', null],['배경색(RGB)', null]]},
      {name:'PC', fields:[['새소식',36],['메인타이틀',18],['설명문구',23],['설명문구',23],['서브링크1',21],['서브링크2',21],['서브링크3',21],['섬네일문구',8],['섬네일문구',8],['섬네일문구',8]]},
      {name:'MO', fields:[['새소식',18],['서브타이틀',15],['타이틀',14],['설명문구',17],['설명문구',17],['섬네일문구',7],['섬네일문구',7],['섬네일문구',7],['섬네일문구',7]]}
    ],
    spec:null, noImageReview:true
  },
  bizboard: {
    label:'카카오 비즈보드', unit:'char', dotColor:'#3C1E1E', dotText:'K', simpleCopyFormat:true,
    groups:[
      {name:'소재 정보', fields:[['소재명', null]]},
      {name:'카피', fields:[['메인카피', null],['서브카피', null]]}
    ],
    spec:{sizes:[[315,258]], minKB:0, maxKB:150, transparentPngRequired:true},
    specHint:'이미지 규격: 315×258px · 투명 PNG 필수 · 용량 150KB 이하',
    note:'메인카피(필수)·서브카피(선택)는 동일 문구로 작성 불가 · 카피 또는 오브젝트 이미지에 광고주체(브랜드명) 표기 필수 · 픽셀폭 한도는 15% 안전마진 적용된 보수적 추정치(오브젝트 이미지 크기에 따라 실제 한도가 다를 수 있음) — 실제로 반려당하면 그 문구 알려줘서 재보정 가능'
  },
  gfa_feed: {
    label:'GFA 피드', unit:'char', dotColor:'#03C75A', dotText:'N',
    groups:[
      {name:'소재 정보', fields:[['소재명', null]]},
      {name:'광고문구', fields:[['광고문구',65]]}
    ],
    spec:{sizes:[[1200,1200]], minKB:80, maxKB:800, logoForbidden:true},
    specHint:'이미지 규격: 1200×1200px · 용량 80~800KB · 로고 포함 불가'
  },
  gfa_smart: {
    label:'GFA 스마트채널', unit:'char', dotColor:'#03C75A', dotText:'N', repeatable:true, sheetLabel:'스마트채널',
    groups:[
      {name:'소재 정보', fields:[['소재명', null]]},
      {name:'광고문구', fields:[['메인문구 1행', null],['메인문구 2행', null],['서브문구 1행', null]]}
    ],
    spec:{sizes:[[260,280]], minKB:20, maxKB:500, transparentRequired:true},
    specHint:'이미지: 최대 260×280px · 배경 투명처리된 누끼형(오브젝트) 이미지 필수 · 용량 20~500KB · 등록 이미지 크기에 따라 텍스트 영역이 가변 적용됨'

function byteLen(str){
  let n = 0;
  for(const ch of str){ n += ch.codePointAt(0) > 127 ? 2 : 1; }
  return n;
}

/* 카카오 비즈보드 카피 실제 렌더링 픽셀폭 측정 (등록화면 CSS 기준: 14px Noto Sans KR 계열) */
const _measureCanvas = document.createElement('canvas');
const _measureCtx = _measureCanvas.getContext('2d');
const KAKAO_COPY_FONT = "14px 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
// 캘리브레이션 기준: celebrity-70 1.png (315x258 오브젝트 이미지) 등록 시 실측 —
// 메인카피 17자("가" 반복)에서 잘림, 서브카피 14자("가" 반복)에서 잘림.
const KAKAO_COPY_MAX_WIDTH_PX = { main: null, sub: null };

function measureTextWidthPx(text, font){
  _measureCtx.font = font || KAKAO_COPY_FONT;
  return _measureCtx.measureText(text).width;
}
// 안전마진: "가" 반복 캘리브레이션은 순수 한글 기준이라, 영문 대문자/공백이 섞인 실제 문구는
// 같은 글자수라도 폭이 더 넓게 나올 수 있음.
// 실측 캘리브레이션(2026-08): "아가리어터 PICK 자취 필수템" = 169px → 반려, "아가리어터 PICK 자취필수템" = 166px → 통과(당시 판단).
// 2026-08-24: 사용자가 앱에서 "아가리어터 PICK 자취필수템"을 입력하니 166px 한도에 걸려 잘림(=이 문구가 실제로는 통과 대상인데 앱이 먼저 컷) —
// 로컬 canvas.measureText 폭이 실제 카카오 심사 시 렌더링 폭보다 더 넓게 측정되는 것으로 보여 한도를 상향 (170px → 167px로 재조정, 2026-08-24).
// 서브카피는 사용자 지정으로 190px (메인 167px과 별도 분리, 2026-08-24).
const KAKAO_SAFETY_FACTOR = 0.85;
KAKAO_COPY_MAX_WIDTH_PX.main = 167;
KAKAO_COPY_MAX_WIDTH_PX.sub = 190;

// GFA 스마트채널 실측 캘리브레이션(2026-08-19): 배너 크기(750x280/200/160)와 무관하게 텍스트 영역 폭은 고정
// (배너가 작아지면 이미지가 작아지거나 메인문구 2행이 빠질 뿐, 글자 수 한도 자체는 안 바뀜 — 사용자 확인).
// "반려 직전 최대" 실측 문구 기준 px:
//   메인문구 1행 "김신영이산다 pick 인생가전" = 162px
//   메인문구 2행 "더 플렌더 MAX 좋아 좋아" = 131px
//   서브문구 1행 "역대급 특가!  8/18(화) 21시 45가가" = 193px
// 반려된 사례(정확한 초과 지점)가 아직 없어 일단 이 값을 상한으로 고정 — 이보다 긴 문구가 반려되면 알려줘서 재보정 가능.
const GFA_SMART_MAX_WIDTH_PX = { '메인문구 1행': 162, '메인문구 2행': 131, '서브문구 1행': 193 };

/* ---------------- 채널별 데이터 저장 ---------------- */
// key -> {fields:{"g0_f0":value,...}, image:{dataURL,base64,mediaType,width,height,kb}|null, items:[{...}]|null}
const channelData = {};
Object.keys(CHANNELS).forEach(key=>{
  channelData[key] = {fields:{}, image:null};
  if(CHANNELS[key].repeatable){
    channelData[key].items = [ makeBlankItem(key) ];
  }
});

function makeBlankItem(key){
  const item = {};
  CHANNELS[key].groups.forEach((g, gi)=>{
    g.fields.forEach((f, fi)=>{ item[`g${gi}_f${fi}`] = ''; });
  });
  return item;
}

function saveCurrentChannelState(){
  const key = currentChannel;
  const store = channelData[key];
  if(!CHANNELS[key].repeatable){
    const inputs = document.querySelectorAll('#formArea .field-input');
    inputs.forEach(inp=>{
      store.fields[`g${inp.dataset.group}_f${inp.dataset.idx}`] = inp.value;
    });
  }
  if(imageBase64){
    store.image = {dataURL:imageDataURL, base64:imageBase64, mediaType:imageMediaType, width:imgWidth, height:imgHeight, kb:imgKB};
  }else if(!CHANNELS[key].noImageReview){
    store.image = null;
  }
}

function restoreChannelState(key){
  const store = channelData[key];
  if(!CHANNELS[key].repeatable){
    const inputs = document.querySelectorAll('#formArea .field-input');
    inputs.forEach(inp=>{
      const saved = store.fields[`g${inp.dataset.group}_f${inp.dataset.idx}`];
      if(saved != null) inp.value = saved;
      updateCount(inp);
    });
  }
  if(store.image && !CHANNELS[key].noImageReview){
    imageBase64 = store.image.base64; imageDataURL = store.image.dataURL;
    imageMediaType = store.image.mediaType; imgWidth = store.image.width; imgHeight = store.image.height; imgKB = store.image.kb;
    uploadBox.classList.add('has-image');
    uploadBox.innerHTML = `<img src="${imageDataURL}"><button class="remove-img" id="removeImg">✕</button>`;
    document.getElementById('removeImg').addEventListener('click', (ev)=>{ ev.stopPropagation(); resetUploadBox(); });

  renderPreview();
}

function renderStatCards(){
  const cfg = CHANNELS[currentChannel];
  const el = document.getElementById('subtitleLine');
  const spec = cfg.spec;

  if(cfg.noImageReview){
    el.innerHTML = `<b>이미지 검수 없음</b> · 텍스트(글자수/금지 키워드)만 검토해`;
    return;
  }
  if(!spec){
    el.textContent = '소재를 입력하고 검수 요청을 눌러줘';
    return;
  }
  const sizeText = spec.sizes ? spec.sizes.map(s=>s.join('×')+'px').join(' / ') : '규격 무관';
  const kbText = (spec.minKB || spec.maxKB)
    ? `${spec.minKB || 0}KB~${spec.maxKB ? (spec.maxKB>=1024 ? (spec.maxKB/1024)+'MB' : spec.maxKB+'KB') : '제한없음'}`
    : '용량 제한 없음';
  const flags = [];
  if(spec.transparentRequired || spec.transparentPngRequired) flags.push('투명배경 필수');
  if(spec.transparentForbidden) flags.push('투명배경 불가');
  if(spec.logoForbidden) flags.push('로고 불가');
  el.innerHTML = `<b>${sizeText}</b> · 용량 ${kbText}${flags.length ? ' · ' + flags.join(' · ') : ''}`;
}

    itemsWrap.querySelectorAll('.field-input').forEach(inp=>{

function getMaxWidthPx(label){
  if(label === '소재명') return null;
  if(currentChannel === 'bizboard'){
    return label === '메인카피' ? KAKAO_COPY_MAX_WIDTH_PX.main : KAKAO_COPY_MAX_WIDTH_PX.sub;
  }
  if(currentChannel === 'gfa_smart'){
    return GFA_SMART_MAX_WIDTH_PX[label] ?? null;
  }
  return null;
}

function updateCount(inp){
  const unit = inp.dataset.unit;
  const limit = inp.dataset.limit ? parseInt(inp.dataset.limit) : null;
  const row = inp.closest('.field-row');
  const maxPx = getMaxWidthPx(inp.dataset.label);

  // 픽셀 한도 초과 시 더 이상 못 쓰게 자동으로 잘라냄 (실제 카카오/GFA가 잘라내는 방식과 동일)
  if(maxPx){
    let val = inp.value;
    let px = Math.round(measureTextWidthPx(val));
    if(px > maxPx){
      while(val.length > 0 && Math.round(measureTextWidthPx(val)) > maxPx){
        val = val.slice(0, -1);
      }
      inp.value = val;
      inp.setSelectionRange(val.length, val.length);
      row.classList.add('limit-hit');
      clearTimeout(inp._limitFlashTimer);
      inp._limitFlashTimer = setTimeout(()=>row.classList.remove('limit-hit'), 350);
    }
  }

  const val = inp.value;
  const count = unit === 'byte' ? byteLen(val) : val.length;
  const countEl = row.querySelector('.field-count');
  countEl.textContent = count + (unit==='byte'?'B':'자') + (limit!=null ? ` / ${limit}` : '');
  const over = limit!=null && count > limit;
  countEl.classList.toggle('over', over);
  row.classList.toggle('over', over);

  const pxEl = row.querySelector('.field-px');
  if(pxEl){
    const px = Math.round(measureTextWidthPx(val));
    pxEl.textContent = px + 'px' + (maxPx ? ` / ${maxPx}` : ' (미보정)');
    pxEl.classList.toggle('over', !!(maxPx && px > maxPx));
  }
  renderPreview();
}

function renderPreview(){
  const section = document.getElementById('previewSection');
  const area = document.getElementById('previewArea');
  if(!PX_ENABLED_CHANNELS.includes(currentChannel)){
    section.style.display = 'none';
    return;
  }
  section.style.display = '';

  const formArea = document.getElementById('formArea');
  const cfgForPreview = CHANNELS[currentChannel];
  const inputs = cfgForPreview.repeatable
    ? formArea.querySelectorAll('.field-input[data-item="0"]')
    : formArea.querySelectorAll('.field-input');
  const imgHtml = imageDataURL
    ? `<img src="${imageDataURL}">`
    : `<div style="font-size:10.5px; color:var(--text-soft); padding:0 8px;">이미지 없음</div>`;

  let linesHtml = '';
  let metaLines = [];
  if(cfgForPreview.repeatable){
    metaLines.push('※ 소재가 여러 개일 때는 1번 소재만 미리보기에 반영됨');
  }
  inputs.forEach(inp=>{
    const label = inp.dataset.label;
    if(label === '소재명' || label === '행사명') return;
    const val = inp.value || (label.includes('메인') ? '메인 카피 예시' : '내용을 입력하세요');
    const px = Math.round(measureTextWidthPx(inp.value || ''));
    const maxPx = getMaxWidthPx(label);
    const isOver = !!(maxPx && px > maxPx);
    const isSub = label.includes('서브');
    const maxWidthStyle = maxPx ? `max-width:${maxPx}px;` : '';
    linesHtml += `<div class="preview-line ${isSub?'sub':''} ${isOver?'overflow':''}" style="${maxWidthStyle}">${escapeHtml(val)}</div>`;
    metaLines.push(`${label}: ${px}px${maxPx ? '/'+maxPx+'px' : ' (미보정)'}`);
  });

  const imgBoxSize = currentChannel === 'bizboard' ? '90px' : '80px';
  area.innerHTML = `
    <div class="preview-box">
      <div class="preview-img-slot" style="width:${imgBoxSize};">${imgHtml}</div>
      <div class="preview-text-slot">${linesHtml}</div>
    </div>
    <div class="preview-meta">${metaLines.join(' · ')}</div>
  `;
}

function generateBrandSearchCopyText(cfg){
  const area = document.getElementById('formArea');
  const metaIdx = cfg.groups.findIndex(g=>g.name === '소재 정보');
  const pcIdx = cfg.groups.findIndex(g=>g.name === 'PC');
  const moIdx = cfg.groups.findIndex(g=>g.name === 'MO');
  const meta = metaIdx>=0 ? collectGroupValues(area, metaIdx, cfg.groups[metaIdx].fields) : [];
  const pc = pcIdx>=0 ? collectGroupValues(area, pcIdx, cfg.groups[pcIdx].fields) : [];
  const mo = moIdx>=0 ? collectGroupValues(area, moIdx, cfg.groups[moIdx].fields) : [];

  const lines = [];
  const materialName = meta[0] ? meta[0].value : '';
  const bgColor = meta[1] ? meta[1].value : '';
  lines.push(`${materialName}\t${bgColor}`);
  lines.push(`PC\t\t\t\tMO`);

  const maxLen = Math.max(pc.length, mo.length);
  for(let i=0; i<maxLen; i++){
    const p = pc[i], m = mo[i];
    const pLabel = p ? `${p.label}${p.limit!=null ? ` (${p.limit})` : ''}` : '';
    const pVal = p ? p.value : '';
    const pCount = p ? (cfg.unit==='byte' ? byteLen(p.value) : p.value.length) : '';
    const mLabel = m ? `${m.label}${m.limit!=null ? ` (${m.limit})` : ''}` : '';
    const mVal = m ? m.value : '';
    const mCount = m ? (cfg.unit==='byte' ? byteLen(m.value) : m.value.length) : '';
    lines.push(`${pLabel}\t${pVal}\t${pCount}\t\t${mLabel}\t${mVal}\t${mCount}`);
  }

  return lines.join('\n');
}

/* 한 줄, 탭 구분 형식 복사 (카카오 비즈보드: 소재명 [tab] 메인카피 [tab] 서브카피) */
function generateSimpleCopyLine(cfg){
  const area = document.getElementById('formArea');
  const values = [];
  cfg.groups.forEach((group, gi)=>{
    group.fields.forEach((f, fi)=>{
      const inp = area.querySelector(`.field-input[data-group="${gi}"][data-idx="${fi}"]`);
      values.push(inp ? inp.value.trim() : '');
    });
  });
  return values.join('\t');
}

function collectFieldsSummary(){
  const cfg = CHANNELS[currentChannel];
  const area = document.getElementById('formArea');
  const lines = [];
  const overLimitIssues = [];

  if(cfg.repeatable){
    const items = channelData[currentChannel].items;
    items.forEach((item, itemIdx)=>{
      lines.push(`[소재 ${itemIdx+1}]`);
      cfg.groups.forEach((group, gi)=>{
        group.fields.forEach((f, fi)=>{
          const [label, limit] = f;
          const fieldKey = `g${gi}_f${fi}`;
          const val = (item[fieldKey] || '').trim();
          const unit = cfg.unit;
          const count = unit === 'byte' ? byteLen(val) : val.length;
          let pxNote = '';
          if(PX_ENABLED_CHANNELS.includes(currentChannel) && label !== '소재명'){
            const px = Math.round(measureTextWidthPx(val));
            const maxPx = getMaxWidthPx(label);
            pxNote = ` [렌더링 폭 약 ${px}px${maxPx ? '/'+maxPx+'px' : ' (미보정)'}]`;
            if(maxPx && px > maxPx){
              overLimitIssues.push({
                severity:'high', category:'텍스트 폭 초과',
                reason:`소재 ${itemIdx+1} "${label}"의 실제 렌더링 폭이 약 ${px}px로 카피 영역 최대폭(${maxPx}px)을 초과해 잘릴 수 있음.`,
                suggestion:'문구를 줄여서 폭을 줄이거나 좁은 자모 위주로 재작성.'
              });
            }
          }
          lines.push(`${label}: ${val || '(공란)'} (${count}${unit==='byte'?'B':'자'}${limit!=null ? '/'+limit : ''})${pxNote}`);
          if(limit != null && count > limit){
            overLimitIssues.push({
              severity:'high', category:'글자수 초과',
              reason:`소재 ${itemIdx+1} "${label}" 필드가 ${count}${unit==='byte'?'byte':'자'}로 제한(${limit}${unit==='byte'?'byte':'자'})을 초과함.`,
              suggestion:`${count - limit}${unit==='byte'?'byte':'자'} 줄여야 함.`
            });
          }
        });
      });
    });
    return {text: lines.join('\n'), overLimitIssues};
  }

  cfg.groups.forEach((group, gi)=>{
    lines.push(`[${group.name}]`);
    area.querySelectorAll(`.field-input[data-group="${gi}"]`).forEach(inp=>{
      const label = inp.dataset.label;
      const limit = inp.dataset.limit ? parseInt(inp.dataset.limit) : null;
      const val = inp.value.trim();
      const unit = inp.dataset.unit;
      const count = unit === 'byte' ? byteLen(val) : val.length;
      let pxNote = '';
      if(PX_ENABLED_CHANNELS.includes(currentChannel) && label !== '소재명'){
        const px = Math.round(measureTextWidthPx(val));
        const maxPx = getMaxWidthPx(label);
        pxNote = ` [렌더링 폭 약 ${px}px${maxPx ? '/'+maxPx+'px' : ' (미보정)'}]`;
        if(maxPx && px > maxPx){
          overLimitIssues.push({
            severity:'high', category:'텍스트 폭 초과',
            reason:`"${label}"의 실제 렌더링 폭이 약 ${px}px로 카피 영역 최대폭(${maxPx}px)을 초과해 잘릴 수 있음.`,
            suggestion:'문구를 줄여서 폭을 줄이거나 좁은 자모 위주로 재작성.'
          });
        }
      }
      lines.push(`${label}: ${val || '(공란)'} (${count}${unit==='byte'?'B':'자'}${limit!=null ? '/'+limit : ''})${pxNote}`);
      if(limit != null && count > limit){
        overLimitIssues.push({
          severity:'high', category:'글자수 초과',
          reason:`"${label}" 필드가 ${count}${unit==='byte'?'byte':'자'}로 제한(${limit}${unit==='byte'?'byte':'자'})을 초과함.`,
          suggestion:`${count - limit}${unit==='byte'?'byte':'자'} 줄여야 함.`
        });
      }
    });
  });
  if(currentChannel === 'bizboard'){
    const inputs = area.querySelectorAll('.field-input');
    let mainVal = '', subVal = '';
    inputs.forEach(inp=>{
      if(inp.dataset.label === '메인카피') mainVal = inp.value.trim();
      if(inp.dataset.label === '서브카피') subVal = inp.value.trim();
    });
    if(mainVal && subVal && mainVal === subVal){
      overLimitIssues.push({
        severity:'high', category:'동일 문구',
        reason:'메인카피와 서브카피가 동일한 문구로 작성됨. 카카오 비즈보드는 두 카피를 동일 문구로 작성할 수 없음.',
        suggestion:'서브카피를 메인카피와 다른 보조 문구로 수정.'
      });
    }
  }

  return {text: lines.join('\n'), overLimitIssues};
}

const uploadBox = document.getElementById('uploadBox');
let fileInput = document.getElementById('fileInput');

function resetUploadBox(){
  imageBase64 = null; imageMediaType = null; imgWidth = null; imgHeight = null; imgKB = null; imageDataURL = null;
  uploadBox.classList.remove('has-image');
  uploadBox.innerHTML = `<input type="file" id="fileInput" accept="image/*"><div class="upload-hint" id="uploadHint"><b>+ 이미지 업로드</b>클릭해서 소재 이미지를 올려줘</div>`;
  fileInput = document.getElementById('fileInput');
  fileInput.addEventListener('change', handleFileChange);
  renderPreview();
}

function handleFileChange(e){
  const file = e.target.files[0];
  if(!file) return;
  imageMediaType = file.type;
  imgKB = file.size / 1024;
  const reader = new FileReader();
  reader.onload = ()=>{
    imageBase64 = reader.result.split(',')[1];
    imageDataURL = reader.result;
    const imgEl = new Image();
    imgEl.onload = ()=>{ imgWidth = imgEl.naturalWidth; imgHeight = imgEl.naturalHeight; };
    imgEl.src = reader.result;
    uploadBox.classList.add('has-image');
    uploadBox.innerHTML = `<img src="${reader.result}"><button class="remove-img" id="removeImg">✕</button><div class="transparency-badge" id="transparencyBadge">투명도 확인 중...</div>`;
    document.getElementById('removeImg').addEventListener('click', (ev)=>{ ev.stopPropagation(); resetUploadBox(); });
    renderPreview();

    detectTransparency(reader.result).then(result=>{
      imgHasTransparency = result;
      const badge = document.getElementById('transparencyBadge');
      if(!badge) return;
      if(result === null){
        badge.textContent = '투명도 확인 불가';
        badge.className = 'transparency-badge unknown';
      }else if(result){
        badge.textContent = '✓ 투명배경 감지됨';
        badge.className = 'transparency-badge yes';
      }else{
        badge.textContent = '✕ 투명배경 없음 (불투명 이미지)';
        badge.className = 'transparency-badge no';
      }
    });
  };
  reader.readAsDataURL(file);
}
uploadBox.addEventListener('click', (e)=>{ if(e.target.classList.contains('remove-img')) return; fileInput.click(); });

/* ---------------- 일괄 붙여넣기 (엑셀 여러 행 → 순서대로 필드 채우기) ---------------- */
document.getElementById('formArea').addEventListener('paste', (e)=>{
  const target = e.target;
  if(!target.classList || !target.classList.contains('field-input')) return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  const lines = text.split(/\r\n|\r|\n/);
  // 마지막이 빈 줄이면 제거 (엑셀에서 복사할 때 흔히 붙는 후행 개행)
  while(lines.length > 1 && lines[lines.length-1] === '') lines.pop();
  if(lines.length <= 1) return; // 한 줄짜리는 기본 붙여넣기 동작 그대로

  e.preventDefault();
  const allInputs = Array.from(document.querySelectorAll('#formArea .field-input'));
  const startIdx = allInputs.indexOf(target);
  if(startIdx === -1) return;

  const filledRows = [];
  lines.forEach((line, i)=>{
    const inp = allInputs[startIdx + i];
    if(!inp) return;
    inp.value = line.trim();
    updateCount(inp);
    const row = inp.closest('.field-row');
    filledRows.push(row);
    row.classList.add('bulk-filled');
  });
  setTimeout(()=>filledRows.forEach(r=>r.classList.remove('bulk-filled')), 500);
});
fileInput.addEventListener('change', handleFileChange);

let imgHasTransparency = null;

function detectTransparency(imgSrc){
  return new Promise((resolve)=>{
    const im = new Image();
    im.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.drawImage(im, 0, 0);
      try{
        const data = ctx.getImageData(0, 0, c.width, c.height).data;
        let transparent = false;
        // 전체 픽셀의 알파 채널을 다 검사 (샘플링하지 않음 — 작은 투명 영역도 놓치지 않도록)
        for(let i = 3; i < data.length; i += 4){
          if(data[i] < 250){ transparent = true; break; }
        }
        resolve(transparent);
      }catch(e){ resolve(null); }
    };
    im.onerror = ()=>resolve(null);
    im.src = imgSrc;
  });
}

function checkImageSpec(){
  const cfg = CHANNELS[currentChannel];
  if(cfg.noImageReview) return [];
  const spec = cfg.spec;
  const problems = [];
  if(!spec || !imageBase64) return problems;
  if(spec.sizes){
    const match = spec.sizes.some(([w,h])=>w===imgWidth && h===imgHeight);
    if(!match){
      problems.push(`업로드 이미지 실제 크기는 ${imgWidth}×${imgHeight}px인데, ${cfg.label} 규격은 ${spec.sizes.map(s=>s.join('×')+'px').join(' 또는 ')}이야. 규격이 안 맞으면 등록 자체가 안 됨.`);
    }
  }
  if(imgKB != null){
    if(spec.minKB && imgKB < spec.minKB) problems.push(`파일 용량 ${imgKB.toFixed(0)}KB로 최소 기준(${spec.minKB}KB) 미달.`);
    if(spec.maxKB && imgKB > spec.maxKB) problems.push(`파일 용량 ${imgKB.toFixed(0)}KB로 최대 기준(${spec.maxKB}KB) 초과.`);
  }
  if(imgHasTransparency != null){
    if(spec.transparentRequired && !imgHasTransparency){
      problems.push('배경이 투명처리된 누끼형(오브젝트) 이미지여야 하는데, 업로드한 이미지에서 투명 영역이 감지되지 않음 (배경이 채워진 사각 이미지로 보임).');
    }
    if((spec.transparentForbidden) && imgHasTransparency){
      problems.push('투명/반투명 배경이 감지됨. 이 채널은 투명배경 이미지 사용이 불가함.');
    }
    if(spec.transparentPngRequired && !imgHasTransparency){
      problems.push('투명 PNG 형식이어야 하는데, 업로드한 이미지에서 투명 영역이 감지되지 않음.');
    }
  }
  return problems;
}

  "summary": "1~2문장 총평",
  "issues": [
    {"severity":"high"|"medium"|"low", "category":"짧은 분류명", "reason":"구체적 사유", "suggestion":"수정 제안"}
  ]
}
issues 없으면 빈 배열로.
`;

/* ---------------- 제출 ---------------- */
document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const {text: fieldsText, overLimitIssues} = collectFieldsSummary();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '심사 중...';
  renderLoading();

  try{
    const userContent = [];
    const cfg = CHANNELS[currentChannel];
    if(imageBase64 && !cfg.noImageReview){
      userContent.push({type:'image', source:{type:'base64', media_type:imageMediaType, data:imageBase64}});
    }
    userContent.push({type:'text', text:
      `채널: ${cfg.label}\n\n입력된 카피:\n${fieldsText}\n\n${cfg.noImageReview ? '이 채널은 이미지 검수 대상이 아니니 텍스트 내용만 심사해줘.\n\n' : ''}위 이미지와 카피를 심사해서 JSON으로만 응답해. 글자수·byte수·픽셀폭 초과 여부는 이미 자동 계산되어 있으니 신경쓰지 말고 내용 기반 이슈만 판단해.`
    });

    const apiKey = window.GEMINI_API_KEY || localStorage.getItem('gemini_api_key') || '';
    if(!apiKey){
      throw new Error('API 키가 설정되지 않았어. 오른쪽 위 ⚙ 아이콘을 눌러 Gemini API 키를 입력해줘.');
    }

    const geminiParts = userContent.map(block=>{
      if(block.type === 'image'){
        return {inline_data:{mime_type: block.source.media_type, data: block.source.data}};
      }
      return {text: block.text};
    });

    const GEMINI_MODEL = 'gemini-3.6-flash';
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        system_instruction:{parts:[{text: SYSTEM_PROMPT}]},
        contents:[{role:'user', parts:geminiParts}],
        generationConfig:{maxOutputTokens:4096, responseMimeType:'application/json'}
      })
    });
    if(!response.ok){
      const errText = await response.text();
      throw new Error(`API 오류 (${response.status}): ${errText}`);
    }
    const data = await response.json();
    const candidateParts = data.candidates?.[0]?.content?.parts || [];
    const textOut = candidateParts.map(p=>p.text || '').join('').trim();
    if(!textOut) throw new Error('응답 없음');

    const finishReason = data.candidates?.[0]?.finishReason;
    if(finishReason === 'MAX_TOKENS'){
      throw new Error('응답이 토큰 한도 때문에 중간에 잘렸어. 다시 시도해줘 (계속 반복되면 알려줘).');
    }

    let clean = textOut.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    let parsed;
    try{
      parsed = JSON.parse(clean);
    }catch(parseErr){
      console.error('JSON 파싱 실패, 원본 응답:', textOut);
      throw new Error(`AI 응답이 JSON 형식이 아니야: ${parseErr.message}\n\n원본 응답(앞부분): ${textOut.slice(0, 300)}`);
    }

    if(imageBase64 && imageDataURL){
      imgHasTransparency = await detectTransparency(imageDataURL);
    }else{
      imgHasTransparency = null;
    }
    const specProblems = checkImageSpec();
    const specIssues = specProblems.map(p=>({severity:'high', category:'규격/용량', reason:p, suggestion:'채널 규격에 맞게 이미지 리사이즈/재압축 후 재업로드'}));

    parsed.issues = [...overLimitIssues, ...specIssues, ...(parsed.issues || [])];
    if(overLimitIssues.length || specIssues.length){
      parsed.verdict = '반려위험';
      const critical = [...overLimitIssues, ...specIssues].map(i=>i.reason).join(' ');
      parsed.summary = `⚠ 규격/용량/글자수 자동 검증에서 문제 발견: ${critical}`;
    }

    renderResult(parsed);
  }catch(err){
    console.error(err);
    renderError(err.message || '판정 중 오류가 났어. 다시 시도해줘.');
  }finally{
    btn.disabled = false; btn.textContent = '검수 요청';
  }
});

function renderLoading(){
  document.getElementById('resultArea').innerHTML = `<div class="loading-state"><div class="spin"></div><div>심사 중...</div></div>`;
}
function renderError(msg){
  document.getElementById('resultArea').innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
}
function verdictMeta(v){
  if(v === '승인유력') return {cls:'pass', icon:'✓', big:'승인 유력', small:'PASS · 별다른 이슈 없음'};
  if(v === '반려위험') return {cls:'fail', icon:'✕', big:'반려 위험', small:'REJECTED · 아래 사유 확인'};
  return {cls:'warn', icon:'!', big:'주의 필요', small:'CAUTION · 검토 후 진행'};
}
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }

function renderResult(parsed){
  const vm = verdictMeta(parsed.verdict);
  const issues = parsed.issues || [];
  let issuesHtml = issues.length === 0
    ? `<div class="no-issues">걸리는 항목 없음</div>`
    : `<div class="issue-list">` + issues.map(is=>`
        <div class="issue ${is.severity}">
          <div class="issue-cat">${escapeHtml(is.category)}</div>
          <div class="issue-reason">${escapeHtml(is.reason)}</div>
          <div class="issue-fix"><b>수정 제안 →</b> ${escapeHtml(is.suggestion)}</div>
        </div>`).join('') + `</div>`;

  document.getElementById('resultArea').innerHTML = `
    <div class="verdict-pill ${vm.cls}"><span class="dot"></span>${vm.big} · ${vm.small}</div>
    <div class="note-box" style="margin-bottom:14px;">${escapeHtml(parsed.summary)}</div>
    ${issuesHtml}
  `;
}

/* 엑셀에 붙여넣었을 때 줄바꿈/탭/따옴표가 있는 값은 셀 하나로 인식되도록 따옴표로 감싸기 */
function tsvCell(value){
  value = value == null ? '' : String(value);
  if(/[\n\t"]/.test(value)){
    return '"' + value.replace(/"/g, '""') + '"';
  }
  return value;
}

document.getElementById('settingsBtn').addEventListener('click', ()=>{
  document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
  document.getElementById('apiKeyStatus').textContent = '';
  document.getElementById('settingsModal').style.display = 'flex';
});
document.getElementById('closeSettings').addEventListener('click', ()=>{
  document.getElementById('settingsModal').style.display = 'none';
});
document.getElementById('settingsModal').addEventListener('click', (e)=>{
  if(e.target.id === 'settingsModal') document.getElementById('settingsModal').style.display = 'none';
});
document.getElementById('saveApiKeyBtn').addEventListener('click', ()=>{
  const val = document.getElementById('apiKeyInput').value.trim();
  const status = document.getElementById('apiKeyStatus');
  if(!val){
    localStorage.removeItem('gemini_api_key');
    status.textContent = '키를 지웠어';
    return;
  }
  localStorage.setItem('gemini_api_key', val);
  status.textContent = '✓ 저장됨 — 이제 검수 요청을 눌러도 돼';
});
renderForm();
</script>
